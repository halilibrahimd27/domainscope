name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in push order: a newer push waits for the running deployment instead of
# cancelling it (a still-queued older run is replaced by the newer one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The whole CI workflow (unit, CLI and offline E2E tests): a red commit is never published.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Publish only the static site (and the CLI so it can be downloaded from the page).
      # assets/ goes under v/<commit>/ so every deploy has new module URLs and browsers never
      # mix cached modules of two deploys; nothing is built (see tools/assemble-site.mjs).
      - name: Assemble site
        run: node tools/assemble-site.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # v4+ drops dotfiles by default; keep .nojekyll
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
