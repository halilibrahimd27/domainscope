name: Senders

# Weekly rebuild of assets/data/senders (the reverse-DNS lists behind DMARC & TLS reports ›
# Identify senders) with tools/build-senders.mjs, from parsedmarc's map at the commit the builder
# pins. When the data changed (the pin, the builder or its checks moved), the job checks it, pushes
# it to the bot/senders branch and opens a pull request (or updates the open one); it never commits
# to main. The builder writes nothing when a download looks wrong or the map at the pinned commit is
# not Apache-2.0 alone, and keeps the lists' date when nothing changed, so a quiet week opens nothing.
on:
  schedule:
    - cron: '41 5 * * 3'   # Wednesdays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: senders
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild the sender lists
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build from parsedmarc's map at the pinned commit
        run: node tools/build-senders.mjs
      # the builder's own checks, lib/senders.js reading the lists, the precache rule and the hygiene scan
      - name: Check the lists
        run: node --test tests/js/build-senders.test.js tests/js/senders.test.js tests/js/pwa.test.js tests/js/repo-hygiene.test.js
      # A pull request opened with this workflow's token does not start CI by itself: close and
      # reopen it (or run CI by hand) before merging. The repository must allow GitHub Actions to
      # create pull requests (Settings › Actions › General).
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- assets/data/senders)" ]; then
            echo "The sender lists did not change."
            exit 0
          fi
          branch=bot/senders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- assets/data/senders
          git commit -m "data(senders): weekly refresh from parsedmarc"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "data(senders): weekly refresh from parsedmarc" \
              --body "The weekly rebuild of assets/data/senders by tools/build-senders.mjs from parsedmarc's reverse-DNS map at its pinned commit (see assets/data/senders/manifest.json for the source, its licence and the counts). Close and reopen this pull request to run CI before merging."
          fi
