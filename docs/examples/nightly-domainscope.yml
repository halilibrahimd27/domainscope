# DomainScope nightly checks: a GitHub Actions template for the headless runner (tools/ds.mjs).
#
# Copy this file to .github/workflows/ of a PRIVATE repository of yours, next to a domains.txt
# (one domain per line, # comments). Every night it runs Domain Health and the Certificate
# Transparency watch for those domains (subdomain discovery, zone drift and renewal readiness
# are there to switch on), commits the JSON reports and Markdown summaries under results/, and
# keeps ONE issue: opened or updated when something changed since the night before, closed on
# a night with no change when every check completed. The results/*.json of one night are the
# next night's baseline; git history keeps every night.
#
# Read this before you switch it on:
# - Use it in a PRIVATE repository. The results name your hosts, their addresses and your DNS
#   records; in a public repository anyone can read them, and forks keep them.
# - Never commit inventories or zone files unless you mean to. The drift step below reads a zone
#   export from this repository: leave it commented out unless that file belongs here. Origin
#   addresses behind proxied names stay hidden in the results unless you add --include-origins.
# - No secret is needed. The job uses the workflow's own GITHUB_TOKEN (contents: write to commit
#   the results, issues: write for the issue); the checks ask keyless public services only (DNS
#   over HTTPS, RDAP, crt.sh, Cert Spotter, the passive subdomain sources). Nothing goes to
#   Globalping: the checks that need a probe stay in the web app, behind a click. The checkout
#   keeps no token while the checks run (persist-credentials: false): only the commit step and
#   the issue step are given it.
# - GitHub's hosted runners share their IP addresses, and the anonymous quotas of the passive
#   sources are per address: a source may answer "rate limited" on some night. The report says
#   so, nothing a source could not read counts as a change, and the next night compares with the
#   last read that worked (a new certificate authority issued during a crt.sh outage still comes
#   out as a new issuer once crt.sh answers). Cert Spotter answers about 10
#   full-domain queries an hour: after its first "rate limited" of a night the runner stops
#   asking it, so with more than about 10 domains most of them are read from crt.sh alone. Add
#   --sources crtsh to the ct line to leave Cert Spotter out altogether.
# - Each check is stopped after CHECK_MINUTES and all of them after RUN_MINUTES (set under "Run
#   the checks"), well inside the job's timeout-minutes: on a slow night (crt.sh down, a big
#   discovery) a check fails, and the results and the issue still get their turn. Raise the
#   three together when you switch more checks on.
# - Pin the DomainScope version: set `ref:` below to a commit SHA of DomainScope (or to a release
#   tag once there is one). On `main` every night runs whatever was pushed last.
name: DomainScope nightly

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC every night (off the full hour, when Actions is busiest)
  workflow_dispatch:

permissions:
  contents: write   # commit results/
  issues: write     # open, update or close the one issue

concurrency:
  group: domainscope-nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository (domains.txt and last night's results)
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # no token in .git/config while the checks run

      - name: Check out DomainScope
        uses: actions/checkout@v7
        with:
          repository: halilibrahimd27/domainscope
          ref: main   # pin a commit SHA (or a release tag once there is one)
          path: .domainscope
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run the checks
        id: ds
        shell: bash
        env:
          CHECK_MINUTES: 20   # one check at most; then it is stopped and counts as failed
          RUN_MINUTES: 45     # every check together; keep it under timeout-minutes
        run: |
          mkdir -p results
          changed=()
          failed=()
          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          # ds NAME COMMAND ARGS...: results/NAME.json is both last night's baseline and tonight's
          # report. Exit 4 means "changed since last night"; anything but 0 or 4 is a failure
          # (124: stopped at its time limit), which leaves last night's files as they were.
          ds() {
            local name=$1
            shift
            local code=0
            local limit=$(( CHECK_MINUTES * 60 ))
            local left=$(( end - $(date +%s) ))
            if [ "$left" -lt "$limit" ]; then limit=$left; fi
            if [ "$limit" -lt 60 ]; then failed+=("$name:no-time-left"); return; fi
            timeout -s INT -k 60 "$limit" node .domainscope/tools/ds.mjs "$@" --baseline "results/$name.json" --json "results/$name.json" \
              --md "results/$name.md" --fail-on-change --no-color || code=$?
            if [ "$code" -eq 4 ]; then changed+=("$name"); elif [ "$code" -ne 0 ]; then failed+=("$name:$code"); fi
          }
          ds health health --list domains.txt
          # More than about 10 domains: Cert Spotter's hourly quota runs out (see above); --sources crtsh leaves it out.
          ds ct ct --list domains.txt
          # Subdomain discovery (slower, and heavier on the passive sources' quotas):
          # ds subdomains subdomains --list domains.txt --level small
          # Only the names you list, no source and no guess (quota-free):
          # ds hosts subdomains --list domains.txt --exact hosts.txt
          # Zone drift: only if the zone export belongs in this repository (see above).
          # ds drift-example drift zones/example.com.zone --origin example.com
          # Renewal readiness of the names you renew (a wildcard too):
          # ds renew renew --list renew-names.txt --ca letsencrypt --challenge dns-01
          echo "changed=${changed[*]}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit the results
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          if ! git diff --cached --quiet; then
            git commit -q -m "domainscope: nightly results $(date -u +%F)"
            # The checkout kept no token: it is handed to these two commands only, never written to disk.
            auth="http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "$auth" pull -q --rebase
            git -c "$auth" push -q
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.ds.outputs.changed }}
          FAILED: ${{ steps.ds.outputs.failed }}
          RESULTS: ${{ github.server_url }}/${{ github.repository }}/tree/${{ steps.commit.outputs.sha }}/results
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=domainscope
          gh label create "$label" --force --color 1d76db --description 'DomainScope nightly checks' > /dev/null
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$CHANGED" ]; then
            {
              echo "Changed since the previous nightly run: $CHANGED. Results: $RESULTS · run: $RUN"
              if [ -n "$FAILED" ]; then
                echo
                echo "These checks did not complete (name:exit code), so nothing of theirs was compared: $FAILED."
              fi
              echo
              for name in $CHANGED; do
                cat "results/$name.md"
                echo
              done
            } > "$RUNNER_TEMP/body.md"
            # An issue body holds 65,536 characters: cut there, never inside a UTF-8 character.
            head -c 60000 "$RUNNER_TEMP/body.md" | iconv -c -f UTF-8 -t UTF-8 > "$RUNNER_TEMP/issue.md"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/issue.md"
              gh issue comment "$issue" --body "Changed again: $CHANGED ($RUN)."
            else
              gh issue create --label "$label" --title 'DomainScope: changes since the last nightly run' --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$FAILED" ]; then
            # A check that failed compared nothing: that is no "no change", so the issue stays open.
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Not closed: these checks did not complete tonight (name:exit code): $FAILED ($RUN)."
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "No change since the previous nightly run, and every check completed ($RUN)."
          fi

      - name: Fail when a check did not complete
        if: steps.ds.outputs.failed != ''
        shell: bash
        env:
          FAILED: ${{ steps.ds.outputs.failed }}
        run: |
          echo "::error::These checks did not complete (name:exit code; 124: stopped at its time limit): $FAILED. See the log of 'Run the checks'."
          exit 1
