name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # pages.yml runs this whole workflow first and deploys only when it passes; a push to main
  # therefore runs it twice (here for the badge, there as the deploy gate), on purpose
  workflow_call:

permissions:
  contents: read

jobs:
  js:
    name: JavaScript tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # the whole suite takes about two minutes; a hung test must not hold the deploy for six hours
    timeout-minutes: 20
    strategy:
      # one Node version failing must not cancel the others: which versions fail is the finding
      fail-fast: false
      matrix:
        # 22 is the floor (package.json engines), 24 and 26 the LTS lines after it
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # includes tests/js/repo-hygiene.test.js: every IPv4 literal in code, tests, fixtures,
      # docs and the gzip wordlists must be documentation space or well-known infrastructure
      # --test-timeout: node --test has no default, so one test that never settles (a socket
      # whose close never comes) would otherwise hang the job; two minutes is far above the
      # slowest test (a few seconds)
      - name: Unit tests (+ repo hygiene)
        run: node --test --test-timeout=120000 "tests/js/*.test.js"

  python:
    name: CLI tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # the floor: setup-python builds 3.9 for Ubuntu 22.04 and 24.04, not for 26.04, so it
          # stays on 24.04 rather than ubuntu-latest; 3.9 and 3.12 read the served chain
          # differently (3.10+ can), 3.13 changed the ssl defaults the CLI's trust check
          # branches on (VERIFY_X509_PARTIAL_CHAIN, VERIFY_X509_STRICT)
          - { python: '3.9', os: ubuntu-24.04 }
          - { python: '3.12', os: ubuntu-latest }
          - { python: '3.13', os: ubuntu-latest }
          - { python: '3.12', os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/python -v

  e2e:
    name: E2E offline suites (headless Chrome)
    runs-on: ubuntu-latest
    # a hung browser must not hold the deploy for run-all's 20 minutes per suite; the 43 suites
    # take about 14 minutes on a laptop, so 30 leaves room for a slower runner
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Ubuntu 24.04's AppArmor may refuse the user namespaces Chrome's sandbox uses; not every
      # image has the switch, so a missing one is fine
      - name: Allow the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # shell, home, subdomains, dirmap, zone, scan, verify, renewal, dane, pfx, chainfix, renew, estate, global --offline, ptr, ipscan, retire, carry, workspaces, domain, change, cutover, privacy, reports, portfolio, locales, explain, revocation, takeover, waivers, regwatch, dmarchistory, monitor, investigate, certificates, migrate, network and watch never leave the
      # machine (fake DoH / Globalping inside the page, every other https:// request blocked;
      # subdomains and scan skip their live scans and resolve only the local server), nor do the offline
      # groups of ip, lookup and health (--offline skips their live groups); the rest hits live,
      # quota-limited APIs and is run by hand. Uses the runner's Google Chrome
      # (/usr/bin/google-chrome).
      - name: Offline E2E (shell, home, subdomains, dirmap, zone, scan, verify, renewal, dane, pfx, chainfix, renew, estate, global, ptr, ipscan, retire, carry, ip, lookup, health, workspaces, wsextras, origins, domain, change, cutover, privacy, reports, portfolio, secscore, locales, explain, revocation, takeover, waivers, regwatch, dmarchistory, monitor, investigate, certificates, migrate, network, watch, transparency)
        run: npm run test:e2e:offline

  blocklists:
    name: Filter lists (no file of the site blocked by an ad or tracker blocker)
    runs-on: ubuntu-latest
    # downloads about 27 MB of lists (60 s at most each) and matches them in about 10 s
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # EasyPrivacy's `/netresults.js` once blocked lib/netresults.js, and with it IP Intel, Bulk
      # Resolve, Reverse DNS and Servers, for every uBlock Origin / AdGuard / Brave user: a file of
      # the site named like a tracker fails here, before the deploy (pages.yml runs this workflow
      # first). A list that cannot be downloaded is a warning, not a failure.
      - name: No file of the site is blocked by EasyList, EasyPrivacy, uBlock Origin or AdGuard
        run: node tools/blocklist-check.mjs
