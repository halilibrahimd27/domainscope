name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # pages.yml runs this whole workflow first and deploys only when it passes; a push to main
  # therefore runs it twice (here for the badge, there as the deploy gate), on purpose
  workflow_call:

permissions:
  contents: read

jobs:
  js:
    name: JavaScript tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # includes tests/js/repo-hygiene.test.js: every IPv4 literal in code, tests, fixtures,
      # docs and the gzip wordlists must be documentation space or well-known infrastructure
      - name: Unit tests (+ repo hygiene)
        run: node --test "tests/js/*.test.js"

  python:
    name: CLI tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { python: '3.8', os: ubuntu-22.04 }
          - { python: '3.12', os: ubuntu-latest }
          - { python: '3.12', os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests/python -v

  e2e:
    name: E2E offline suites (headless Chrome)
    runs-on: ubuntu-latest
    # a hung browser must not hold the deploy for run-all's 20 minutes per suite
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Ubuntu 24.04's AppArmor may refuse the user namespaces Chrome's sandbox uses; not every
      # image has the switch, so a missing one is fine
      - name: Allow the Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # shell, subdomains, zone, scan, verify, renewal, dane, pfx, chainfix, renew, estate, global --offline, ptr, retire, carry, workspaces, domain, change, cutover, privacy, reports, portfolio, locales, explain, revocation, takeover, waivers, regwatch, dmarchistory and monitor never leave the
      # machine (fake DoH / Globalping inside the page, every other https:// request blocked;
      # subdomains and scan skip their live scans and resolve only the local server), nor do the offline
      # groups of ip, lookup and health (--offline skips their live groups); the rest hits live,
      # quota-limited APIs and is run by hand. Uses the runner's Google Chrome
      # (/usr/bin/google-chrome).
      - name: Offline E2E (shell, subdomains, zone, scan, verify, renewal, dane, pfx, chainfix, renew, estate, global, ptr, retire, carry, ip, lookup, health, workspaces, origins, domain, change, cutover, privacy, reports, portfolio, secscore, locales, explain, revocation, takeover, waivers, regwatch, dmarchistory, monitor)
        run: npm run test:e2e:offline
